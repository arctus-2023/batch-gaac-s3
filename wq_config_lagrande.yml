# Water Quality Retrieval Pipeline
# Sentinel-3 OLCI · Sentinel-2 MSI · Landsat-8 OLI · Landsat-9 OLI-2
# Copy and edit this template; set l2_dir, l3_dir, and aoi_name for your run.

# Optional: inject gaac_gen into sys.path to enable Cinputmask for mask reading.
# If omitted, the pipeline falls back to reading mask tags directly (works for
# all mask files produced by the GAAC batch pipeline).
gaac_gen_dir: /home/yan/WorkSpace/pycharm_proj/gaac_arctus/gaac_gen/src

# Input: L2 directory containing *_GAAC/ scene subdirectories. Searched
# recursively, so per-mission subdirectories (L2/S2/, L2/L8/, …) are picked up.
l2_dir: /home/yan/WorkSpace/projects/SAMBA/DATA/L2/

# Output: root for L3 product tree (PMP + DRP will be created here)
l3_dir: /home/yan/WorkSpace/projects/SAMBA/DATA/L3/

# AOI label used in DRP filenames, e.g. JamesBay_20250710_chla.tif
aoi_name: LaGrande

# ── Band matching ─────────────────────────────────────────────────────────────
# Algorithms declare nominal wavelengths (the OLCI-centric numbers used in the
# literature); each is matched to the nearest band the scene actually carries,
# within this tolerance [nm].  15 nm covers every substitution needed across the
# four missions — e.g. 665→655 on OLI, 709→704 and 865→864 on MSI — while still
# rejecting genuinely absent bands such as 510 nm on MSI/OLI.
band_tolerance: 15

# ── Water quality products ────────────────────────────────────────────────────
# For each product, choose the algorithm and optionally override coefficients.
# Set enabled: false to skip a product entirely.
#
# `sensors:` overrides the algorithm for particular missions. Keys are matched
# most-specific-first — exact sensor tag (S3_OLCIA, S2_MSIB, L8_OLI, L9_OLI2),
# then platform (S3A, S2, L8, L9), then instrument family (OLCI, MSI, OLI).
# A value may be a bare algorithm name or a full {algorithm, params, enabled}
# mapping; `enabled: false` under a sensor skips that product for it, and an
# override can equally re-enable a product that is disabled by default.
#
# Available algorithms (run `python batch_wq.py <config> --list-algorithms`
# for the live table with bands and supported sensors):
#   chla      : oc4me (OLCI) | gons2005 (OLCI/MSI) | ndci (OLCI/MSI) | nir_red (OLI)
#   cdom      : glukhovets2020 | mabit2022 | mabit_redgreen        (all missions)
#   spm       : nechad2010 | dogliotti2015 | doxaran2012 | mabit_powerlaw (all missions)
#   turbidity : dogliotti2015_t | dogliotti2015_hs (all) | nechad2016_olci (OLCI)
#
# An algorithm that a scene cannot support — wrong instrument family, or a
# required band the mission lacks — is skipped for that scene with a warning,
# so a config naming only OLCI algorithms still runs (partially) on MSI/OLI.

wq_products:
  chla:
    enabled: true
    algorithm: ndci            # normalised difference chlorophyll index (665/709)
    params: {}
    sensors:
      OLI: nir_red             # OLI has no red edge at all — empirical proxy only
    # OLCI and MSI both run ndci: the 665/709 nm pair resolves on MSI to B4/B5
    # (665, 704 nm), inside band_tolerance.  Preferred here over the three-band
    # gons2005, whose 709/779 nm terms go invalid over most of this reservoir —
    # it returned chla on only 2–12% of water pixels, against ~100% for ndci.
    # Override example (quadratic NDCI→chla fit):
    # params:
    #   A0: 14.039
    #   A1: 86.115
    #   A2: 194.325

  cdom:
    enabled: true
    algorithm: mabit_redgreen  # red/green log-power (665/560), SAMBA L3 chain
    params: {}
    # One algorithm for every mission: mabit_redgreen needs only a red and a
    # green band, both of which OLCI, MSI and OLI carry, so no per-sensor
    # override is needed and the cross-sensor DRP composites stay comparable.
    # The blue-ratio alternatives (mabit2022 443/560, glukhovets2020 443/490)
    # lean on bands MSI and OLI resolve too coarsely for CDOM.
    # Override example:
    # params:
    #   A: 20.0
    #   B: 1.8

  spm:
    enabled: true
    algorithm: mabit_powerlaw  # single-band log-power, SAMBA l3_MSI_OLI form
    params: {}
    # Runs on all three families, but NOT on one shared calibration: the band
    # and the fitted pair are per-instrument (MSI 740 nm A=17 B=0.42; OLI 665 nm
    # B4 and OLCI 665 nm Oa8 both A=13 B=0.52).  Cross-sensor DRP composites
    # therefore pool retrievals from separate fits — acceptable here because it
    # matches the SAMBA notebook, but it is why mabit_powerlaw and dogliotti2015
    # must not be mixed across missions inside one composite.
    # Per-family coefficient override example:
    # params: {MSI_A: 17.5, OLI_A: 13.0, OLCI_A: 13.0}

  turbidity:
    enabled: true
    algorithm: dogliotti2015_hs # hard ρw(red)<0.05 switch, matching the SAMBA L3 chain
    params: {}
    # One algorithm for every mission: 665 + 865 nm exist on OLCI, MSI and OLI
    # alike, so no per-sensor override is needed and the cross-sensor DRP
    # composites stay on a single calibration.  nechad2016_olci is the sharper
    # OLCI-only alternative (its middle branch is the Oa11 709 nm LUT, which MSI
    # and OLI have no equivalent for), at the cost of that comparability.

# ── Aggregation ───────────────────────────────────────────────────────────────
# DRP composites merge every contributing mission for a period into one product:
# <aoi>_<date>_<product>.tif. Because the missions do not share a grid, each PMP
# is warped onto the common `grid` below before it enters the composite.
aggregation:
  method: mean                 # temporal statistic (mean only currently supported)
  periods:
    - daily
    - monthly
    - yearly

  # Which sensors take part. Selectors may be an exact sensor tag (S3_OLCIA,
  # S2_MSIB, L8_OLI, L9_OLI2), a platform (S3A, S2, L8, L9), or an instrument
  # family (OLCI, MSI, OLI). Use `all` — or omit the key — for every sensor.
  # PMPs are still produced for every scene; this only filters the composites.
  sensors: all
  # sensors: [MSI, OLI]        # e.g. Sentinel-2 + Landsat only, excluding OLCI

  # Common target grid. Fixing it here keeps composites comparable across runs
  # even as the set of available scenes changes — strongly preferred over
  # letting it be derived, which lets the extent move between runs.
  #   resolution : metres; a single value, or [xres, yres]
  #   bounds     : [minx, miny, maxx, maxy] in `crs`, or `auto` for the union
  #                of the contributing scenes
  #   resampling : average (best for downsampling continuous fields) | bilinear
  #                | cubic | nearest | mode | min | max | med
  # Omit the whole `grid` block and inputs that already share a grid are
  # composited in place with no warping; a mixed set then falls back to the
  # finest contributing resolution, with a warning.
  grid:
    crs: EPSG:32617
    resolution: 30
    bounds: [596055, 5932935, 649125, 5999145]
    resampling: average

# Set true to recompute and overwrite existing output files
replace_output: true
