# ── Paths ────────────────────────────────────────────────────────────────────
# Directory containing gaac_gen/src (added to sys.path at runtime)
gaac_gen_dir: /home/yan/WorkSpace/pycharm_proj/gaac_arctus/gaac_gen/src

# Path to the acolite package root (set as $gaac_acolite_dir env var)
acolite_dir: /home/yan/WorkSpace/open_source/acolite_origin/acolite

# Folder containing the S3 L1 GeoTIFF images
l1_dir: /home/yan/WorkSpace/projects/SAMBA/DATA/S3OLCI/L1/s3_olci/JamesBay/2025

# Root output directory; each scene gets its own sub-folder (<scene>_GAAC/)
output_dir: /home/yan/WorkSpace/projects/SAMBA/DATA/S3OLCI/L2_SPATIAL

# ── Debug output ─────────────────────────────────────────────────────────────
# Write the intermediate fields each stage worked from, on top of the products:
#   <scene>_aotpattern.tif  aot550 before smoothing + the blue-band rho_aws,
#                           rho_rc, rho_adj, rho_g it was inverted from
#   <scene>_rhog_ref.tif    rho_g at the glint reference band, the quantity
#                           MASK.GLINT_MASK.THRESHOLD is applied to
# Omit to keep SYSTEM.DEBUG from gaac_gen/config/defult_config.yml. The --debug
# and --no-debug flags override this key.
debug: false

# ── Scene filter ─────────────────────────────────────────────────────────────
# Minimum clear-water percentage (0–100). Scenes below this value are skipped.
# Clear-water pixels are those with classification value == 1 in the last band.
# Classification: 0=clear_land, 1=clear_water, 2=cloud_land, 3=cloud_water, 255=invalid
clear_water_threshold: 5.0

# ── Input type ───────────────────────────────────────────────────────────────
# ACOTOA  : TOA reflectance produced by ACOLITE (used for S3 OLCI GeoTIFFs)
# GEETOA  : TOA reflectance downloaded from Google Earth Engine
input_type: ACOTOA

# ── Cgaac constructor kwargs ─────────────────────────────────────────────────
cgaac:
  straylight: false       # include stray-light correction
  ae_correction: true     # include adjacency-effect correction

# ── Rayleigh & gas correction ─────────────────────────────────────────────────
rayleigh:
  proc: acolite           # 'acolite' (LUT-based) or 'gaac' (MLP-based)
  replace_output: false   # recompute even if output already exists
  output_rgb: true        # write an enhanced RGB preview after Rayleigh correction
  use_ancillary: false    # use ancillary atmospheric data (e.g. MERRA-2) for Rayleigh correction

# ── Water masking ─────────────────────────────────────────────────────────────
water_masking:
  method: ndwi            # water-index method (only ndwi supported)
  threshold: 0.0          # NDWI threshold — pixels above are classified as water
  replace_output: false   # recompute mask even if it already exists
  closing: true           # apply morphological closing to fill small holes
  selem_size: 5           # side length (px) of the square structuring element

# ── Snow / ice masking ───────────────────────────────────────────────────────
# ENDSIII (default): spectral index (Oa12-Oa16+Oa20-Oa21)/(Oa12+Oa16+Oa20+Oa21)
snow_masking:
  snow_method: ENDSIII      # ENDSIII (default) or NDSI_OTSU
  threshold: -0.06          # ENDSIII fixed threshold (ignored when use_otsu: true)
  use_otsu: false           # compute threshold via Otsu on permanent water pixels
  min_area_pixels: 10       # remove connected components smaller than this
  nir865_threshold: 0.05    # Oa17 (865 nm) brightness gate: pixels with rhot_865 >= this
                            # value are excluded from the ENDSIII snow mask

# NDSI_OTSU alternative: NDSI (Oa17/Oa21) > snow_threshold AND Oa02 > blue_threshold.
# Set use_otsu: true to derive both thresholds via Otsu on permanent water pixels
# (classification band values 1 and 3); fixed thresholds are used as fallback.
#snow_masking:
#  snow_method: NDSI_OTSU
#  use_otsu: false           # true: Otsu thresholds (falls back to fixed); false: fixed only
#  snow_threshold: 0.03     # NDSI threshold (direct when use_otsu false, fallback otherwise)
#  blue_threshold: 0.5      # Oa02 (412 nm) threshold (direct when use_otsu false, fallback otherwise)

# ── Acolite-derived masking (non-water, cirrus, high TOA) ────────────────────
# Bits 0, 1 and 2 of the final mask. Defaults, including the OLCI-specific
# thresholds, live in gaac_gen/config/acolite_mask_config.yml — this block only
# needs the keys you want to override, in the same nested shape.
#
# For OLCI the defaults resolve to:
#   non-water  Oa21 1016 nm > 0.05
#   cirrus     Oa20  939 nm > 0.015   (water vapour band, not true cirrus)
#   high TOA   Oa03..Oa21        > 0.3
#
# A pixel needs every bit clear to be eligible as a GA optimisation pixel, so
# loosening a threshold here directly widens the candidate pool.
#aco_masking:
#  NONWATER: {ENABLED: true, WAVE: 1020, THRESHOLD: 0.05}
#  CIRRUS:   {ENABLED: true, WAVE: 940,  THRESHOLD: 0.015}
#  HIGH_TOA: {ENABLED: true, THRESHOLD: 0.3, WAVE_RANGE: [440, 1050]}
#  SMOOTH:   {ENABLED: false, SIGMA: 3}

# ── High sun-glint risk masking (bit 10) ─────────────────────────────────────
# rho_g at the glint reference band (Oa21 for OLCI) is isolated from the
# Rayleigh-corrected reflectance by subtracting rho_adj, rho_a and rho_sky, all
# three taken from a scene-wide dark spectrum fit (ACOLITE's DSF, adapted to
# GAAC's aerosol MLP). Pixels above THRESHOLD are flagged, which removes them
# from the GA optimisation pool — only an all-zero mask pixel is selectable.
# Water flagged this way is still water for the AE/PSF geometry.
#
# The log prints the rho_g distribution over water (median / p90 / p99 / max)
# and WRITE_RHOG leaves the <scene>_rhog_ref.tif raster behind, which is how the
# threshold gets tuned. Defaults live in gaac_gen/config/defult_config.yml.
#
# Caveat: at 1016 nm, highly turbid water has real water-leaving signal, so
# sediment plumes are flagged as glint. That is the same assumption GAAC's own
# glint correction makes, so such a pixel is a poor optimisation target either
# way — but raise the threshold if it costs you too much of a turbid scene.
#glint_masking:
#  ENABLED: true
#  THRESHOLD: 0.01       # rho_g(Oa21) above this counts as heavy glint
#  WRITE_RHOG: true      # write <scene>_rhog_ref.tif
#  WATER_ONLY: true      # only set the bit over water
#  DSF:                  # dark spectrum fit overrides (see FORWARD_MODEL.DSF)
#    PERCENTILE: 1.0
#    WATER_ONLY: false   # include land in the dark spectrum, as acolite does

# ── Aerosol & AC ─────────────────────────────────────────────────────────────
aerosol:
  replace_output: false   # recompute AC output even if it already exists
  perform_ac: true        # apply the full atmospheric correction after optimisation
  best_ind: []            # 7-element list to skip GA and use a fixed aerosol solution;
                          # leave empty ([]) to run GA optimisation automatically
  fillno: false           # fill no-data pixels before AC (needed for some sensors)
  smooth: false           # apply spatial smoothing to the output reflectance
  # smooth_size: 7        # kernel size for smoothing (only used when smooth: true)
  # How the aerosol varies across the scene:
  #   uniform  one GA solution tiled everywhere (the original behaviour)
  #   tiled    one GA per tile, spatially interpolated -- needs tile_size
  #   spatial  one GA for the level, with the spatial pattern taken from the
  #            blue band (443 nm). Writes <scene>_aot550.tif. Tuned by
  #            FORWARD_MODEL.SPATIAL in gaac_gen/config/defult_config.yml --
  #            SMOOTH_SCALE (metres) is the main knob. Watch the log for the
  #            turbidity-correlation warning: above it the pattern is tracking
  #            water type rather than aerosol and will over-correct the plume.
  # Omitting aerosol_mode keeps the old rule: tile_size present means tiled.
  aerosol_mode: spatial
  # tile_size: 200      # tiled mode only -- unset here, this run is not tiled
